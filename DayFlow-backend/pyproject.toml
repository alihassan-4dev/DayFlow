[project]
name = "dayflow-backend"
version = "0.1.0"
description = "DayFlow API — tasks, auth, and the AI assistant."
readme = "README.md"

authors = [
    { name = "alihassan-4dev", email = "alihassan.4dev@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "mem0ai>=0.1.30",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "qstash>=3.4",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
# Optional local long-term memory (embeddings + vector store). Too heavy for
# cloud deployment; install explicitly with `uv sync --group local-memory`.
local-memory = [
    "sentence-transformers>=6.0.0",
    "chromadb>=1.5.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.fastapi]
entrypoint = "app.main:app"
